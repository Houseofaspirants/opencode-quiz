name: notify

# After every push to main, announce new MCQ sets, study material, current
# affairs, previous-year papers and books on the Telegram channel - in Punjabi,
# with the direct link. Compares the generated manifests before and after the
# push (scripts/notify_new_content.py), so nothing is announced twice.
#
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   Secrets:   TELEGRAM_BOT_TOKEN      token from @BotFather; the bot must be an
#                                      admin of the channel
#   Variables: TELEGRAM_CHANNEL        optional, default @HouseOfAspirant
#              TELEGRAM_OWNER_CHAT_ID  optional, your own chat id - you get a
#                                      plain-text copy to forward to WhatsApp
on:
  push:
    branches: [main]
    paths:
      - "data/index.json"
      - "data/content-manifest.json"
      - "data/books.json"

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post new uploads to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          TELEGRAM_OWNER_CHAT_ID: ${{ vars.TELEGRAM_OWNER_CHAT_ID }}
        run: >
          python3 scripts/notify_new_content.py
          --before "${{ github.event.before }}"
          --after "${{ github.sha }}"
          --wait-live
